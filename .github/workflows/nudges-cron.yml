name: KYROO Nudges Scheduler

on:
  schedule:
    - cron: '*/10 * * * *'  # every 10 minutes; nudge_service.py's fire window covers the gap
  workflow_dispatch:  # manual trigger for testing

jobs:
  check-and-send:
    runs-on: ubuntu-latest
    steps:
      - name: Check and send due nudges
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          status=$(curl -s -o response.txt -w "%{http_code}" -X POST \
            https://kyroo-whatsapp.onrender.com/nudges/check-and-send \
            -H "X-Cron-Secret: $CRON_SECRET")
          echo "HTTP status: $status"
          echo "Response body:"
          cat response.txt
          if [ "$status" -ge 400 ]; then
            exit 1
          fi
