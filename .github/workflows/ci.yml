name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python-compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile-check app/ (kyroo-whatsapp service)
        run: python -m compileall -q app
      - name: Compile-check kiro-backend/
        run: python -m compileall -q kiro-backend -x 'venv/'

  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install app/ dependencies and run its tests
        run: |
          pip install -r requirements.txt
          pytest app/tests -v
      - name: Install kiro-backend/ dependencies and run its tests
        working-directory: kiro-backend
        run: |
          pip install -r requirements.txt
          pytest tests -v

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kiro-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: kiro-frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit -p tsconfig.json
      - run: npm run build
