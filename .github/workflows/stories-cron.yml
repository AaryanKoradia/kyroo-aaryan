name: KYROO Story Cache Refresh

on:
  schedule:
    - cron: '0 */6 * * *'  # every 6 hours — story content doesn't need to be fresher than that
  workflow_dispatch:  # manual trigger for testing

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Refresh cached stories
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          status=$(curl -s -o response.txt -w "%{http_code}" -X POST \
            https://kyroo-whatsapp.onrender.com/stories/refresh \
            -H "X-Cron-Secret: $CRON_SECRET")
          echo "HTTP status: $status"
          echo "Response body:"
          cat response.txt
          if [ "$status" -ge 400 ]; then
            exit 1
          fi
